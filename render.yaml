services:
  - type: web
    name: condominium-booking-and-operation-management-system
    env: node
    plan: free
    autoDeploy: true

    buildCommand: npm install && npm run build
    startCommand: npm start

    healthCheckPath: /api/health

    disk:
      name: data-disk
      sizeGB: 1
      mountPath: /app/data

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: "3000"

      - key: GEMINI_API_KEY
        sync: false

      - key: VITE_FIREBASE_API_KEY
        sync: false

      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false

      - key: VITE_FIREBASE_PROJECT_ID
        sync: false

      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false

      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false

      - key: VITE_FIREBASE_APP_ID
        sync: false

      - key: VITE_FIREBASE_MEASUREMENT_ID
        sync: false